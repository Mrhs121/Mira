name: Build Mira macOS App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (macOS arm64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & macOS version
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: app/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('app/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build Mira.app
        run: |
          chmod +x app/build.sh
          ./app/build.sh

      - name: Package ZIP and DMG
        run: |
          ditto -c -k --sequesterRsrc --keepParent app/build/Mira.app Mira-macos-arm64.zip
          mkdir -p dmg-staging
          cp -R app/build/Mira.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Mira" -srcfolder dmg-staging -ov -format UDZO Mira-macos-arm64.dmg
          ls -lh Mira-macos-arm64.zip Mira-macos-arm64.dmg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mira-macos-arm64
          path: |
            Mira-macos-arm64.zip
            Mira-macos-arm64.dmg
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Mira v0.1.0' }}
          generate_release_notes: true
          files: |
            Mira-macos-arm64.zip
            Mira-macos-arm64.dmg
